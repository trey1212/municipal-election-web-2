name: Build and deploy ASP app to Azure Web App - municipal-election-backend2

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build MEMS.Api
        run: dotnet build MEMS.Api/MEMS.Api.csproj --configuration Release

      - name: Publish MEMS.Api
        run: dotnet publish MEMS.Api/MEMS.Api.csproj -c Release -o ./published

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: ./published

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ASP-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EAB17AEF884542B880136E078F636251 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E901093DAF7F4B8DBB8BE4E4CCA5D397 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_23E3FCCE678448629FA3206A367F08B9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "municipal-election-backend2"
          slot-name: "Production"
          package: .
